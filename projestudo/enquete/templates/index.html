<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquete Musical</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .enquete-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        .enquete-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .alternativa-item {
            margin-bottom: 20px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e8e8e8;
            transition: all 0.3s ease;
        }
        .radio-label:hover {
            border-color: #667eea;
            background-color: #f5f5f9;
        }
        .radio-label input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }
        .radio-label span {
            font-size: 16px;
            color: #333;
            text-transform: capitalize;
            font-weight: 500;
        }
        .botao-votar {
            width: 100%;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="enquete-container">
        <div class="enquete-title">
            <h1 class="title is-3">{{ pergunta }}</h1>
        </div>

        <form method="POST" action="{% url 'enquete:votar' %}">
            {% csrf_token %}
            
            <div class="alternativas">
                {% for alternativa in alternativas %}
                    <div class="alternativa-item">
                        <label class="radio-label">
                            <input type="radio" name="alternativa" value="{{ alternativa }}" required>
                            <span>{{ alternativa }}</span>
                        </label>
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="button is-fullwidth is-primary botao-votar">
                <strong>Votar</strong>
            </button>
        </form>
    </div>
</body>
</html>
