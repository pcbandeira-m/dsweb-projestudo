<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
</head>
<body class="has-background-link-light" style="font-family: 'Roboto', sans-serif;">

    <section class="hero is-fullheight">
        <div class="hero-body is-justify-content-center is-align-items-center">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-4-desktop is-6-tablet is-10-mobile">
                        
                        <form id="imc-form" action="{% url 'imc:calcular' %}" method="post">
                            {% csrf_token %}
                            <h1 class="title has-text-centered has-text-primary-dark">
                                Calculadora de IMC
                            </h1>
                            <p class="subtitle is-6 has-text-centered has-text-grey mb-5">
                                Insira seus dados abaixo
                            </p>

                            <div class="field mt-4">
                                <label class="label">Altura (m)</label>
                                <div class="control">
                                    <input class="input is-info is-rounded" 
                                           type="number" 
                                           name="altura"
                                           step="0.01" 
                                           placeholder="Ex: 1.75" 
                                           required>
                                </div>
                            </div>

                            <div class="field mt-4">
                                <label class="label">Peso (kg)</label>
                                <div class="control">
                                    <input class="input is-primary is-rounded" 
                                           type="number" 
                                           step="0.1" 
                                           name="peso"
                                           placeholder="Ex: 75.5" 
                                           required>
                                </div>
                            </div>

                            <div class="field mt-6">
                                <div class="control">
                                    <button class="button is-primary is-fullwidth is-medium is-rounded has-text-weight-bold">
                                        Calcular IMC
                                    </button>
                                </div>
                            </div>

                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
